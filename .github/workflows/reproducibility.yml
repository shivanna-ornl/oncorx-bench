name: Reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    container:
      image: python:3.9.6-bullseye
    steps:
      - uses: actions/checkout@v5
      - name: Confirm reference Python
        run: python --version
      - name: Confirm dependency-free environment
        run: python -m pip install --requirement requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Byte-check the benchmark release
        run: python scripts/reproduce_release.py --check
      - name: Rebuild-check views from pinned UOTD files
        run: python scripts/build_uotd_inputs.py --check
